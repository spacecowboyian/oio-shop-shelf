slug: alpine-a110
title: "Alpine A110 Repair Manual (Type A 110 — 1300 VA/VB/VC, 1600 VB) — 1st edition, October 1970"

taxonomy:
  make: alpine
  category: vehicle
  models: [a110]
  chassis: [1300VA, 1300VB, 1300VC, 1600VB]
  engines: [810-30, 812-00, 807-25]
  years: "1970-1971"

source:
  type: local
  location: "alpine-a110.pdf"
  pages: 87

rights: >
  Copyright of the original manual belongs to Societe des Automobiles ALPINE / Renault.
  No license was sought; committing it here is a considered risk, taken deliberately.
  See CONTRIBUTING.md. This copy is an English translation of the French original, of
  uncertain provenance — see README.md.

ocr:
  language: eng
  force: false

render:
  dpi: 200

# The manual numbers its pages by SECTION CODE (A-1, B-13, N-4...), not continuously, so
# section_code below is the manual's own letter tab. Each section opens with an unnumbered
# illustrated divider plate; the numbered pages follow it.
chapters:
  - file: "a-general.md"
    section_code: "A"
    title: "General — covers, contents, vehicle presentation and characteristics"
    page_start: 1
    page_end: 9
  - file: "b-engine-ignition.md"
    section_code: "B"
    title: "Engine and Ignition (Moteur - Allumage)"
    page_start: 10
    page_end: 25
  - file: "c-electrical-equipment.md"
    section_code: "C"
    title: "Electrical Equipment (Equipement electrique)"
    page_start: 26
    page_end: 29
  - file: "d-clutch.md"
    section_code: "D"
    title: "Clutch (Embrayage)"
    page_start: 30
    page_end: 32
  - file: "e-gearbox.md"
    section_code: "E"
    title: "Gearbox (Boite de vitesses)"
    page_start: 33
    page_end: 37
  - file: "g-steering.md"
    section_code: "G"
    title: "Steering (Direction)"
    page_start: 38
    page_end: 39
  - file: "h-front-axle.md"
    section_code: "H"
    title: "Front Axle (Train avant)"
    page_start: 40
    page_end: 44
  - file: "j-rear-axle.md"
    section_code: "J"
    title: "Rear Axle (Train arriere)"
    page_start: 45
    page_end: 46
  - file: "l-suspension-shock-absorbers.md"
    section_code: "L"
    title: "Suspension and Shock Absorbers (Suspension - Amortisseurs)"
    page_start: 47
    page_end: 48
  - file: "m-braking-system.md"
    section_code: "M"
    title: "Braking System (Freinage)"
    page_start: 49
    page_end: 50
  - file: "n-bodywork.md"
    section_code: "N"
    title: "Bodywork (Carrosserie)"
    page_start: 51
    page_end: 57
  - file: "r-special-tooling.md"
    section_code: "R"
    title: "Special Tooling (Outillage special) and manual update log"
    page_start: 58
    page_end: 60
  # --- Update supplement (mise a jour / Technical Notes), bound after the manual proper.
  # Amendments dated December 1970 into 1971. Mixed section codes, so no section_code here.
  - file: "u1-supplement-general-engine-electrical.md"
    title: "Update supplement — title page; amendments to Chapters A, B and C"
    page_start: 61
    page_end: 63
  - file: "u2-supplement-wiring-harness-directory.md"
    title: "Update supplement — wiring harness and connector directory (images only)"
    page_start: 64
    page_end: 72
  - file: "u3-supplement-steering-brakes.md"
    title: "Update supplement - amendments to Chapters C, D, E, G, H, J, L, M and N"
    page_start: 73
    page_end: 75
  - file: "u4-supplement-bodywork-paint.md"
    title: "Update supplement — paint and lacquer compositions; chassis and body checking"
    page_start: 76
    page_end: 82
  - file: "u5-supplement-special-tooling.md"
    title: "Update supplement — Chapter R special tooling and tool drawings"
    page_start: 83
    page_end: 87

# Diagram delivery (04_cleanup_methodology.md Rule 12). Two kinds of entry here:
#   - genuine diagrams/plates (wiring diagram, timing chain, advance curves, drawings);
#   - pages whose ENGLISH TRANSLATION OVERLAY is rotated across the French original and is
#     unreadable as text (D-1, E-2, E-3, Table 2, and the whole wiring-harness directory).
#     Those are delivered because no faithful transcription of them is possible.
diagrams:
  - page: 7
    file: "diagrams/p0007-general-dimensions.webp"

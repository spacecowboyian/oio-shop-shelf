# ---------------------------------------------------------------------------
# THREE BOUND DOCUMENTS IN ONE PDF.
#
#   PDF   1-374  The large German Reparaturhandbuch. Full overhaul chapters for the
#                engines and gearboxes, and the only part covering the later 1600 SC /
#                SC-SI cars (types 1600 VD / 1600 VH). Continuously numbered, but the
#                printed-to-PDF offset DRIFTS from -1 to +10 because unnumbered plate
#                and divider pages are interleaved; it also inserts suffixed pages
#                (e.g. 114a). There is no constant offset to apply.
#
#   PDF 375-433  The 1st edition, October 1970 factory repair manual, in German.
#                Paginated by the factory's own SECTION CODES (A-1, B-2, H-1 ...), not
#                continuously. This is the German original of the same manual the repo
#                previously held only as an English machine translation (closed PR #29).
#
#   PDF 434-468  The update supplement (Technische Notizen), carrying amendments dated
#                December 1970 onward. Re-issues changes against the section codes above
#                and adds the cable directory, bulb table and lacquer tables.
#
# Chapter page ranges below are 1-based inclusive SOURCE-PDF pages and are contiguous
# across all 468 pages. section_code is the manual's own letter tab where it has one;
# the Reparaturhandbuch part has no letter tabs, so those chapters omit it.
# ---------------------------------------------------------------------------

# S2000 AP1/AP2 Service Manual (2000-2008) — single-manual package.
# Taxonomy placement, source pointer, rights, and chapter map.
# Required fields: slug, title, source, rights, chapters, taxonomy.
# See manuals/_template/manifest.yml for the full field reference.

slug: honda-s2000
title: "Honda S2000 (AP1/AP2) Service Manual"

# Placement in the automotive taxonomy — manuals/taxonomy.yml.
# category: vehicle -> declare models + chassis. engines omitted per repo directive
# (no K20A/K24A engine entries are registered for the S2000 package; the registry
# keeps makes.honda.engines: {} for the same reason).
taxonomy:
  make: honda
  category: vehicle
  models: [s2000]
  chassis: [AP1, AP2]
  years: "2000-2008"

# Pointer to the SOURCE PDF (contributor hand-off; not committed — PDFs are gitignored).
source:
  type: local
  location: "2000-08 Honda S2000 SM.pdf"
  pages: 1970

rights: >
  Copyright of the original manual belongs to Honda / America Honda. The
  maintainer-selected publication set includes the chapter text, all rendered
  page images, and registered diagrams. The source PDF and raw OCR remain
  private and excluded from Git. See CONTRIBUTING.md.

# OCR settings for 01_prepare_pdf.py
ocr:
  language: eng
  force: false

# Render settings for 02_render_pages.py
render:
  dpi: 200


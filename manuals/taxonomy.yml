# Automotive taxonomy — the controlled vocabulary for every manual in this repo.
#
# WHY THIS EXISTS
#   Folders give each manual ONE human-browsable home (manuals/<make>/<vehicle|engine>/<unit>/).
#   This file is the canonical name registry behind those folders: it fixes the *spelling* of
#   every make, model, chassis and engine so "Toyota"/"toyota"/"TOYOTA" and "MR2"/"MR-2" never
#   drift apart across contributions. Each manifest.yml declares a `taxonomy:` block whose
#   make / models / chassis / engines MUST resolve to keys defined here — CI enforces it
#   (scripts/validate_manifests.py). The per-manual README front matter is generated from the
#   resolved names (scripts/10_write_frontmatter.py) so an agent can grep one manual straight
#   to the right car.
#
# SOURCE / PROVENANCE
#   Make + model names and IDs are anchored to the NHTSA vPIC catalog — the US DOT's
#   public-domain Vehicle Product Information Catalog (https://vpic.nhtsa.dot.gov/api/).
#   `vpic_make_id` is that catalog's stable Make_ID; `name` is its canonical Make_Name /
#   Model_Name. Engine-family codes (4A-GE, etc.) have no clean open catalog, so those are
#   OEM designations recorded by hand.
#
# HOW TO ADD AN ENTRY
#   Seed only what a committed manual actually needs — do NOT import all of vPIC. Before
#   adding a manual for a make/model/engine not listed here, add it here first. Full steps
#   (including the vPIC lookup) are in taxonomy.md.
#
# SHAPE
#   makes:
#     <make-key>:                      # lower-kebab; the folder name under manuals/
#       name: <Canonical vPIC Make_Name>
#       vpic_make_id: <int>            # vPIC Make_ID (anchor; omit only if not in vPIC)
#       models:                        # vehicles this make has manuals for (may be empty)
#         <model-key>:
#           name: <Canonical Model_Name>
#           chassis: [<CODE>, ...]     # generation/chassis codes covered
#       engines:                       # engine families this make has manuals for
#         <engine-key>:
#           name: <OEM engine code>
#           family: <engine-family letter/series, optional>

makes:
  toyota:
    name: Toyota
    vpic_make_id: 448
    models:
      mr2:
        name: MR2
        chassis: [AW11]        # 1st-gen (1984-1989); 4A-GE / supercharged 4A-GZE
      corolla:
        name: Corolla
        # FWD generations only (this repo has no RWD Corolla manual yet):
        # E80 (1984-1987) AE82/AE80; E90 (1988-1992) AE91/AE92. Codes are general
        # knowledge, not from a manual's own VIN section — flagged best-effort.
        chassis: [AE80, AE82, AE91, AE92]
    engines:
      4a-c:
        name: 4A-C             # carbureted, Corolla FWD 1984-1987
        family: A
      4a-f:
        name: 4A-F
        family: A
      4a-fe:
        name: 4A-FE
        family: A
      4a-ge:
        name: 4A-GE
        family: A
      4a-gze:
        name: 4A-GZE          # supercharged 4A (AW11 SC)
        family: A
      18r:
        name: 18R
        family: R
      18r-c:
        name: 18R-C
        family: R
      18r-g:
        name: 18R-G
        family: R

  renault:
    name: Renault
    vpic_make_id: 13647
    models:
      dauphine:
        name: Dauphine
        # R1090 Dauphine, R1091 Dauphine Gordini, R1093 Dauphine "1093" (competition).
        # The M.R.93 factory manual covers all three (Ondine = trim of R1090).
        chassis: [R1090, R1091, R1093]
    engines:
      ventoux:
        name: Ventoux (Type 670)   # 845 cc OHV "Ventoux", Dauphine's engine family
        family: Ventoux
  alpine:
    name: Alpine
    vpic_make_id: 11081
    models:
      a110:
        name: A110
        # Factory "type" codes. vPIC has no A110 model entry (the catalog is VIN-era,
        # post-1981), so the model name is the OEM designation, not a vPIC Model_Name.
        # 1300VA/VB/VC, 1600VB and GS are the cover-stated types of the model-70 book.
        # 1600VC/VD/VH come from the "Wichtigste Einstellungen" plate (printed p.12) of the
        # German Reparaturhandbuch — the later SC and SI cars.
        chassis: [1300VA, 1300VB, 1300VC, 1600VA, 1600VB, 1600VC, 1600VD, 1600VH]
    engines:
      # --- Cléon-Fonte / "Sierra" derived, 1300 cars ---
      810-30:
        name: 810-30            # version "85" / 1300 VC; derived from Renault 810-03 (R1192)
        family: Sierra
      810-05:
        name: 810-05            # 1300 VC per the Reparaturhandbuch settings plate; 1289 cm3
        family: Sierra
      812-00:
        name: 812-00            # 1300 G / 1300 S; derived from Renault 8 Gordini
        family: Sierra
      # --- Cléon-Alu, 1600 cars ---
      807-25:
        name: 807-25            # 1600 S / 1600 VB; derived from 807-01 (Renault 16 TS); 1565 cm3
        family: Cleon-Alu
      843-30:
        name: 843-30            # 1600 VH; 1647 cm3
        family: Cleon-Alu
      844-30:
        name: 844-30            # 1600 VD, "SC"; 1605 cm3
        family: Cleon-Alu
      844-32:
        name: 844-32            # 1600 VC; 1605 cm3
        family: Cleon-Alu
      844-34:
        name: 844-34            # 1600 VD, "SI" (electronic fuel injection); 1605 cm3
        family: Cleon-Alu
      1600-gs:
        name: 1600 GS           # competition engine option, derived from 807-25
        # The 1970 manual gives NO engine number for this one: its own characteristics table
        # (B-2) prints the version name "1600 GS" in the column where every other version
        # prints an engine code. So "1600 GS" is the designation the source actually uses,
        # not a stand-in for a code we failed to find.
        family: Cleon-Alu

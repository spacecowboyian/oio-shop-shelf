<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#0b0b0c; --fg:#e8e8ea; --dim:#8a8a93; --accent:#d8b24a;
    /* Sized against viewport height so the chrome stays legible from a 1080p
       panel up to a 4K one, where a fixed 44px bar nearly disappears. */
    --bar: clamp(44px, 6.1vh, 132px);
    --fs:  clamp(15px, 2.05vh, 44px);
    --fs-s: clamp(13px, 1.8vh, 38px);
    --sel: clamp(5px, 0.7vh, 15px);
    --gap: clamp(10px, 1.4vh, 30px); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #stage { position:absolute; inset:0 0 var(--bar) 0; display:flex; align-items:center;
    justify-content:center; gap:var(--gap); padding:var(--gap); }
  .pane { position:relative; height:100%; display:flex; align-items:center; justify-content:center; }
  .pane canvas, .pane img { background:#fff; box-shadow:0 0 0 1px #2a2a2e, 0 8px 30px #0008;
    max-height:100%; max-width:100%; object-fit:contain; }
  .pane.empty canvas, .pane.empty img { visibility:hidden; }
  .pane.sel canvas, .pane.sel img { box-shadow:0 0 0 var(--sel) var(--accent), 0 8px 30px #0008; }
  #zoomwrap { position:absolute; inset:0 0 var(--bar) 0; display:none; overflow:hidden;
    background:var(--bg); }
  #zoomwrap.on { display:block; }
  #zoomcanvas, #zoomimg { position:absolute; transform-origin:0 0; background:#fff; }
  #zoomimg { display:none; }
  /* One unwrappable row. Anything that can reflow here visibly twitches on every
     page turn, because the label's width changes with the page number. */
  #bar { position:fixed; left:0; right:0; bottom:0; height:var(--bar); display:flex;
    align-items:center; gap:calc(var(--gap) * 1.6); padding:0 calc(var(--gap) * 1.6);
    background:#141417; border-top:1px solid #26262b; font-size:var(--fs);
    white-space:nowrap; overflow:hidden; }
  #label { color:var(--accent); font-weight:600; flex:0 0 auto;
    font-variant-numeric:tabular-nums; }
  #manual { color:var(--dim); flex:1 1 auto; min-width:0;
    overflow:hidden; text-overflow:ellipsis; }
  #hint { color:var(--dim); flex:0 0 auto; font-size:var(--fs-s); }
  #busy { position:absolute; top:var(--gap); right:calc(var(--gap) * 1.6);
    color:var(--dim); font-size:var(--fs-s);
    opacity:0; transition:opacity .15s; }
  #busy.on { opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <div class="pane" id="paneL"><canvas id="cL"></canvas><img id="iL" alt="" hidden></div>
  <div class="pane" id="paneR"><canvas id="cR"></canvas><img id="iR" alt="" hidden></div>
</div>
<div id="zoomwrap"><canvas id="zoomcanvas"></canvas><img id="zoomimg" alt=""></div>
<div id="busy">rendering…</div>
<div id="bar">
  <span id="label">—</span>
  <span id="manual">__TITLE__</span>
  <span id="hint">◀ ▶ page · OK zoom · ▲▼ in zoom: pan · BACK exit zoom</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const qs = new URLSearchParams(location.search);
const FILE = qs.get("file") || "manual.pdf";
const OVERSAMPLE = parseFloat(qs.get("os") || "2");   // render beyond CSS size, then downscale
const MAXPX = parseInt(qs.get("maxpx") || "3508", 10); // native scan height; never exceed
const PRELOAD = 2;
let page = Math.max(1, parseInt(qs.get("page") || "1", 10));
let doc = null, total = 0;
let zoom = false, zscale = 1, zx = 0, zy = 0;
let sel = 0;                     // 0 = left page, 1 = right page

const cL = document.getElementById("cL"), cR = document.getElementById("cR");
const paneL = document.getElementById("paneL"), paneR = document.getElementById("paneR");
const label = document.getElementById("label"), busy = document.getElementById("busy");
const zwrap = document.getElementById("zoomwrap"), zc = document.getElementById("zoomcanvas");

const cache = new Map(), inflight = new Map();

// Image mode: the manual has pre-rendered page images (data/pages.json), so there is
// nothing to rasterise — the browser just decodes a PNG. Much faster on a weak TV,
// and no PDF download at all. Falls back to pdf.js when a manual has no images.
let IMAGES = null;                       // array of page URLs, 1-based by index+1
const iL = document.getElementById("iL"), iR = document.getElementById("iR");
const zoomimg = document.getElementById("zoomimg");

function imgUrl(n) { return (n >= 1 && n <= IMAGES.length) ? IMAGES[n - 1] : null; }

function preloadImages(from, to) {
  for (let n = from; n <= to; n++) {
    const u = imgUrl(n);
    if (u) { const im = new Image(); im.src = u; }
  }
}

function showImages() {
  cL.hidden = true; cR.hidden = true;        // the pdf.js canvases are unused here
  label.textContent = `p. ${page}${page + 1 <= total ? "\u2013" + (page + 1) : ""} of ${total}`;
  const a = imgUrl(page), b = imgUrl(page + 1);
  iL.hidden = !a; if (a) iL.src = a;
  iR.hidden = !b; if (b) iR.src = b;
  paneL.classList.toggle("empty", !a);
  paneR.classList.toggle("empty", !b);
  if (!b) sel = 0;
  applySel();
  preloadImages(page - PRELOAD * 2, page + 1 + PRELOAD * 2);
}

function enterZoomImage() {
  const u = imgUrl(Math.min(page + sel, total));
  if (!u) return;
  zoomimg.onload = () => {
    const fitH = innerHeight - barPx();
    const cssW = zoomimg.naturalWidth / zoomimg.naturalHeight * fitH;
    zoomimg.style.height = fitH + "px"; zoomimg.style.width = cssW + "px";
    zscale = 2;
    zx = (innerWidth - cssW * zscale) / 2; zy = -(fitH * zscale - fitH) / 2;
    applyZoom();
  };
  zoomimg.src = u;
  zoomcanvasHide();
  zoom = true; zwrap.classList.add("on");
}

function zoomcanvasHide() { zc.style.display = "none"; zoomimg.style.display = "block"; }
const dpr = window.devicePixelRatio || 1;

function barPx() {
  return parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue("--bar")) || 44;
}
function cssHeight() { return document.getElementById("stage").clientHeight - 20; }
function renderPx()  { return Math.min(MAXPX, Math.round(cssHeight() * dpr * OVERSAMPLE)); }


async function renderToCanvas(n, px) {
  const pg = await doc.getPage(n);
  const base = pg.getViewport({ scale: 1 });
  const vp = pg.getViewport({ scale: px / base.height });
  const c = document.createElement("canvas");
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  await pg.render({ canvasContext: c.getContext("2d", { alpha:false }), viewport: vp }).promise;
  return c;
}

function getPage(n, px) {
  if (n < 1 || n > total) return Promise.resolve(null);
  const key = n + "@" + px;
  if (cache.has(key)) return Promise.resolve(cache.get(key));
  if (inflight.has(key)) return inflight.get(key);
  const p = renderToCanvas(n, px).then(c => {
    cache.set(key, c); inflight.delete(key);
    while (cache.size > 6) cache.delete(cache.keys().next().value);  // TV memory is tight
    return c;
  });
  inflight.set(key, p);
  return p;
}

function blit(canvas, src, pane) {
  if (!src) { pane.classList.add("empty"); return; }
  pane.classList.remove("empty");
  canvas.width = src.width; canvas.height = src.height;      // full-res backing store
  canvas.style.height = cssHeight() + "px";                  // CSS downscale = sharp
  canvas.style.width = "auto";
  canvas.getContext("2d", { alpha:false }).drawImage(src, 0, 0);
}

async function show() {
  if (IMAGES) return showImages();
  const px = renderPx();
  label.textContent = `p. ${page}${page + 1 <= total ? "\u2013" + (page + 1) : ""} of ${total}`;
  busy.classList.add("on");
  const [a, b] = await Promise.all([getPage(page, px), getPage(page + 1, px)]);
  blit(cL, a, paneL); blit(cR, b, paneR);
  if (!b) sel = 0;
  applySel();
  busy.classList.remove("on");
  for (let d = 2; d <= 1 + PRELOAD * 2; d++) {
    const fwd = page + d, back = page - (d - 1);
    if (fwd <= total) getPage(fwd, px);
    if (back >= 1) getPage(back, px);
  }
}

function applySel() {
  paneL.classList.toggle("sel", sel === 0);
  paneR.classList.toggle("sel", sel === 1 && !paneR.classList.contains("empty"));
}

function flip(delta) {
  if (!doc && !IMAGES) return;
  const next = page + delta * 2;
  if (next < 1 || next > total) return;
  page = next;
  history.replaceState(null, "", IMAGES ? `?page=${page}`
                                        : `?file=${encodeURIComponent(FILE)}&page=${page}`);
  show();
}

async function enterZoom() {
  if (IMAGES) return enterZoomImage();
  if (!doc) return;
  const target = Math.min(page + sel, total);
  const pg = await doc.getPage(target);
  const base = pg.getViewport({ scale: 1 });
  const vp = pg.getViewport({ scale: MAXPX / base.height });   // native resolution
  zc.width = Math.ceil(vp.width); zc.height = Math.ceil(vp.height);
  busy.classList.add("on");
  await pg.render({ canvasContext: zc.getContext("2d", { alpha:false }), viewport: vp }).promise;
  busy.classList.remove("on");
  const fitH = innerHeight - barPx();                               // CSS size = fit-to-screen
  const cssW = zc.width / zc.height * fitH;
  zc.style.height = fitH + "px"; zc.style.width = cssW + "px";
  zscale = 2;                                                  // then 2x on top of fit
  zx = (innerWidth - cssW * zscale) / 2; zy = -(fitH * zscale - fitH) / 2;
  applyZoom(); zoom = true; zwrap.classList.add("on");
}
function applyZoom() { (IMAGES ? zoomimg : zc).style.transform = `translate(${zx}px,${zy}px) scale(${zscale})`; }
function exitZoom() { zoom = false; zwrap.classList.remove("on"); }

const ZOOM_KEYS = new Set(["Enter","NumpadEnter","Select","Accept"," ","Spacebar","MediaPlayPause"]);
const EXIT_KEYS = new Set(["Escape","Esc","Backspace","GoBack","BrowserBack"]);

addEventListener("keydown", e => {
  const k = e.key, kc = e.keyCode;
  const RIGHT = k === "ArrowRight" || kc === 39;
  const LEFT  = k === "ArrowLeft"  || kc === 37;
  const UP    = k === "ArrowUp"    || kc === 38;
  const DOWN  = k === "ArrowDown"  || kc === 40;
  const OK    = ZOOM_KEYS.has(k) || kc === 13 || kc === 23 || kc === 32;
  const BACK  = EXIT_KEYS.has(k) || kc === 27 || kc === 8 || kc === 4;

  if (!zoom) {
    if (RIGHT) {                                   // select right page, else next spread
      if (sel === 0 && !paneR.classList.contains("empty")) { sel = 1; applySel(); }
      else { sel = 0; flip(1); }
      e.preventDefault();
    } else if (LEFT) {                             // select left page, else previous spread
      if (sel === 1) { sel = 0; applySel(); }
      else { sel = 1; flip(-1); }
      e.preventDefault();
    } else if (OK) { enterZoom(); e.preventDefault(); }
  } else {
    const step = 140;
    if (RIGHT) { zx -= step; applyZoom(); e.preventDefault(); }
    else if (LEFT) { zx += step; applyZoom(); e.preventDefault(); }
    else if (UP) { zy += step; applyZoom(); e.preventDefault(); }
    else if (DOWN) { zy -= step; applyZoom(); e.preventDefault(); }
    else if (BACK || OK) { exitZoom(); e.preventDefault(); }
  }
});

addEventListener("resize", () => { cache.clear(); show(); });

// Poll for a page pushed by `serve.py --goto N`, and for a requested reload. Only a
// change in rev moves the view, so this never fights the remote while you are reading.
let lastRev = null, lastReload = null;
setInterval(async () => {
  try {
    const st = await (await fetch("/state", { cache: "no-store" })).json();
    // A reload is requested by bumping a counter: the sender cannot reliably push a
    // fresh page to a cast receiver, so the page refreshes itself.
    if (lastReload === null) lastReload = st.reload;
    else if (st.reload !== lastReload) { location.reload(); return; }

    if (lastRev === null) { lastRev = st.rev; return; }
    if (st.rev !== lastRev) {
      lastRev = st.rev;
      if (!doc && !IMAGES) return;
      if (zoom) exitZoom();
      page = Math.min(Math.max(1, st.page), total);
      sel = 0;
      show();
    }
  } catch (e) { /* server gone; keep showing what we have */ }
}, 1500);

(async () => {
  label.textContent = "loading\u2026";
  let mode = { mode: "pdf", urls: [] };
  try { mode = await (await fetch("/pages.json", { cache: "no-store" })).json(); } catch (e) {}

  if (mode.mode === "images" && mode.urls.length) {
    IMAGES = mode.urls;
    total = IMAGES.length;
    if (page > total) page = 1;
    show();
    return;
  }

  label.textContent = "loading PDF\u2026";
  doc = await pdfjsLib.getDocument({ url: FILE, rangeChunkSize: 262144 }).promise;
  total = doc.numPages;
  if (page > total) page = 1;
  show();
})().catch(err => { label.textContent = "error: " + err.message; });

</script>
</body>
</html>

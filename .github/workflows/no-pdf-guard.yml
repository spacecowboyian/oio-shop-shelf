name: no-pdf-guard

# Hard guard: no PDF may ever land in git history. Source PDFs live on GitHub Releases
# (see MAINTAINERS.md), never committed to a branch that merges into main.
#
# Diagram images are DELIBERATELY NOT guarded. They are committed to the tree so that
# `raw.githubusercontent.com` serves them: a Release asset 302s to a signed URL on another
# host and is served as application/octet-stream, which external AI assistants cannot
# fetch or read. A tree file is served as image/png from the same host as the markdown,
# and that is verified to work. See MAINTAINERS.md.
#
# - On a manual PR, the contributor's committed PDF makes this check RED — that is
#   EXPECTED. It clears when a maintainer runs `scripts/publish-release.sh <manual-dir>`
#   (which moves the PDF to a Release and removes it from the tree) before squash-merging.
# - On push to main, this is a backstop that should always be green.
#
# For pull_request events, actions/checkout checks out the merge result, so this reflects
# exactly what main would become.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any PDF is tracked
        run: |
          # Source PDFs live on GitHub Releases, never in git history. A committed PDF makes
          # this RED — EXPECTED on an unpublished manual PR; publish-release.sh clears it.
          # Diagram images are intentionally NOT checked: they belong in the tree so raw
          # URLs serve them to external readers (see MAINTAINERS.md).
          pdfs="$(git ls-files '*.pdf' || true)"
          if [ -n "$pdfs" ]; then
            echo "::error::PDF(s) are committed to git. Source PDFs must live on GitHub Releases, not in history."
            echo "Tracked PDF(s):"; echo "$pdfs" | sed 's/^/  - /'
            echo ""
            echo "Before merging, a maintainer must, for each manual dir:"
            echo "  scripts/publish-release.sh <manual-dir>   # e.g. manuals/toyota/vehicle/mr2-aw11"
            echo "then commit and SQUASH-merge (never rebase / merge-commit). See MAINTAINERS.md."
            exit 1
          fi
          echo "OK — no tracked PDFs."
